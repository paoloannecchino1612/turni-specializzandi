<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turni Specializzandi</title>
<meta name="theme-color" content="#0f6b8f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turni">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: tool a schede (Mese · Indisponibilità · Turni · Impostazioni), tabella turni a scorrimento orizzontale */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#15202b; --muted:#5d6b78; --line:#d9e0e6;
  --accent:#0f6b8f; --accent-ink:#ffffff; --accent-soft:#e1f0f6;
  --m:#ffe3c7; --m-ink:#9a4700; --p:#dbe7ff; --p-ink:#1f4ea6; --n:#ece0fb; --n-ink:#5b2d9c; --d:#fde0de; --d-ink:#b3261e; --f:#dcf2e2; --f-ink:#1d7a3e; --c:#fff2bf; --c-ink:#7a5d00;
  --bad:#b4282d; --bad-soft:#fbe7e7; --ok:#1d7a4a; --warn-soft:#fff4dc; --off:#eceff2; --chg:#e8770c; --chg-soft:#ffe8cc;
  --f-display:"Schibsted Grotesk",system-ui,sans-serif; --f-body:"Figtree",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --surface:#172026; --ink:#e4ebf0; --muted:#94a3af; --line:#2a3741;
  --accent:#4fb4d8; --accent-ink:#06222e; --accent-soft:#163541;
  --m:#4a2c0e; --m-ink:#ffbf80; --p:#16294a; --p-ink:#9ec2ff; --n:#30204d; --n-ink:#cdb3ff; --d:#4a1a1a; --d-ink:#ff9b94; --f:#143a24; --f-ink:#8fe0a9; --c:#3d3410; --c-ink:#f5d76e;
  --bad:#ff7b80; --bad-soft:#3a1c1e; --ok:#5fd398; --warn-soft:#3a3016; --off:#1d272e; --chg:#ff9d3d; --chg-soft:#4a2a08; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172026; --ink:#e4ebf0; --muted:#94a3af; --line:#2a3741;
  --accent:#4fb4d8; --accent-ink:#06222e; --accent-soft:#163541;
  --m:#4a2c0e; --m-ink:#ffbf80; --p:#16294a; --p-ink:#9ec2ff; --n:#30204d; --n-ink:#cdb3ff; --d:#4a1a1a; --d-ink:#ff9b94; --f:#143a24; --f-ink:#8fe0a9; --c:#3d3410; --c-ink:#f5d76e;
  --bad:#ff7b80; --bad-soft:#3a1c1e; --ok:#5fd398; --warn-soft:#3a3016; --off:#1d272e; --chg:#ff9d3d; --chg-soft:#4a2a08; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin:0;letter-spacing:-.01em}
.sync{font-size:.78rem;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:600 .9rem var(--f-body);background:none;border:0;color:var(--muted);padding:8px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
h2{font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:.95rem;margin:0}
.label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
section.view{padding-top:16px;display:flex;flex-direction:column;gap:16px}
.monthbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.monthbar .name{font-family:var(--f-display);font-weight:700;font-size:1.15rem;min-width:9.5em;text-align:center;text-transform:capitalize}
.period{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
button.btn,label.btn{display:inline-block;font:600 .88rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.btn.danger{color:var(--bad)}
button.btn.confirm{background:var(--bad);color:#fff;border-color:var(--bad)}
button.icon{width:36px;height:36px;padding:0;font-size:1.1rem}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:500 .9rem var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
input[type=number]{width:4.2em;font-family:var(--f-mono);text-align:center;padding:6px 4px}
.list{display:flex;flex-direction:column}
.list .item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.rotrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,11em);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rotrow:first-child{border-top:0}
.name-strong{font-weight:600;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 .75rem var(--f-mono);padding:2px 7px;border-radius:999px;background:var(--off);color:var(--muted);white-space:nowrap}
.sh-M{background:var(--m);color:var(--m-ink)} .sh-P{background:var(--p);color:var(--p-ink)} .sh-N{background:var(--n);color:var(--n-ink)} .sh-D{background:var(--d);color:var(--d-ink)}
.pickers{display:flex;gap:6px;flex-wrap:wrap}
.pickers button{font:600 .85rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.pickers button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pickers button .cnt{font-family:var(--f-mono);opacity:.75;margin-left:4px}
/* calendario indisponibilità */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dow{font-size:.7rem;text-align:center;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.cal button.day{min-height:62px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:5px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;cursor:pointer;text-align:left;min-width:0}
.cal button.day .d{font:600 .9rem var(--f-mono)}
.cal button.day.out .d{color:var(--muted)}
.cal button.day.we{background:var(--off)}
.cal button.day.fes .d{color:var(--bad)}
.cal button.day.full{background:var(--bad-soft);border-color:var(--bad)}
.cal button.day .marks{display:flex;gap:2px;flex-wrap:wrap}
.cal button.day .marks span{font:600 .62rem var(--f-mono);padding:0 4px;border-radius:4px}
.cal .full-tag{font:600 .62rem var(--f-mono);color:var(--bad)}
/* tabelle */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.grid{border-collapse:separate;border-spacing:0;font-size:.82rem;width:max-content;min-width:100%}
table.grid th,table.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 7px;vertical-align:top;text-align:left}
table.grid thead th{position:sticky;top:0;background:var(--surface);z-index:1;font-weight:600}
table.grid .sticky{position:sticky;left:0;background:var(--surface);z-index:2}
table.grid thead .sticky{z-index:3}
/* tabella "Per giorno": scorre dentro il riquadro, così le righe con le sale restano sempre visibili in alto */
.scroll.tall{max-height:calc(100vh - 120px);max-height:calc(100dvh - 120px);overflow:auto}
.scroll.tall thead{position:sticky;top:0;z-index:4}
.scroll.tall thead th{position:static}
.scroll.tall thead th.sticky{position:sticky;left:0;z-index:5}
table.grid th.roomh{font-family:var(--f-display);text-align:center;font-size:.85rem}
table.grid td.date{font-family:var(--f-mono);white-space:nowrap;font-size:.78rem}
table.grid tr.we td.date{color:var(--accent);font-weight:600}
table.grid tr.fes td.date{color:var(--bad);font-weight:600}
table.grid tr.weekstart td{border-top:2px solid var(--muted)}
table.grid td.cell{min-width:7.5em;cursor:pointer}
table.grid td.cell:hover{background:var(--accent-soft)}
table.grid td.cell.none{color:var(--line);cursor:default}
table.grid td.cell.chg{background:var(--chg-soft);box-shadow:inset 0 0 0 2px var(--chg)}
table.grid td.cell.sel{outline:3px solid var(--accent);outline-offset:-3px;background:var(--accent-soft)}
table.grid td.cell.none:hover{background:none}
.who{display:block;white-space:nowrap}
.hole{display:inline-block;font:600 .72rem var(--f-mono);color:var(--bad);background:var(--bad-soft);padding:1px 6px;border-radius:4px}
td.num{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.code{font:600 .72rem var(--f-mono);text-align:center}
.code.M{background:var(--m);color:var(--m-ink)} .code.P{background:var(--p);color:var(--p-ink)} .code.N{background:var(--n);color:var(--n-ink)} .code.D{background:var(--d);color:var(--d-ink)}
table.grid td.code{white-space:nowrap;font-size:.68rem}
.code.S{color:var(--muted)} .code.X{background:var(--bad-soft);color:var(--bad)}
.alerts{background:var(--warn-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.alerts.bad{background:var(--bad-soft)}
.alerts ul{margin:0;padding-left:18px}
.okline{color:var(--ok);font-weight:600;font-size:.9rem}
.needs{display:grid;grid-template-columns:auto repeat(3,auto);gap:6px 10px;align-items:center;justify-content:start}
.needs .hd{font-size:.72rem;color:var(--muted);font-weight:600;text-align:center}
.roomcard{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.roomcard:first-of-type{border-top:0;padding-top:0}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
/* postazioni */
.post{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.post:first-of-type{border-top:0;padding-top:0}
.post .top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.post .top input{flex:1 1 8em;font-weight:600}
.pickers.sm button{padding:4px 10px;font-size:.8rem}
.groupname{font:600 .72rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.tag-F{background:var(--f);color:var(--f-ink)} .tag-C{background:var(--c);color:var(--c-ink)}
.full-tag.tag-F,.full-tag.tag-C{padding:0 4px;border-radius:4px}
.cal button.day.fer-day{background:var(--f);border-color:var(--f-ink)}
.cal button.day.con-day{background:var(--c);border-color:var(--c-ink)}
.code.F{background:var(--f);color:var(--f-ink)} .code.C{background:var(--c);color:var(--c-ink)}
table.grid td.code.monto{padding:0;vertical-align:stretch;height:1px}
.mn{display:flex;flex-direction:column;height:100%;min-height:2.4em}
.mn span{flex:1;display:flex;align-items:center;justify-content:center;padding:2px 4px}
.mn .mt{color:var(--muted);border-bottom:1px solid var(--line)}
.mn .nt{background:var(--n);color:var(--n-ink)}
.cal button.day.low{box-shadow:inset 0 -3px 0 var(--bad)}
.lowdot{display:inline-block;width:14px;height:3px;background:var(--bad);vertical-align:middle;border-radius:2px}
table.grid td.cell.swapped{box-shadow:inset 3px 0 0 var(--accent)}
table.grid td.cell.swapped .who::after{content:" ↔";color:var(--accent);font-weight:700}
select:disabled,button:disabled{opacity:.55;cursor:not-allowed}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,28,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(560px,100%);max-height:85vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:14px}}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 11px;cursor:pointer;font:500 .9rem var(--f-body)}
.cand:hover{border-color:var(--accent)}
.cand[disabled]{opacity:.5;cursor:not-allowed}
.cand .why{font-size:.75rem;color:var(--bad)}
.cand.cur{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:.88rem;z-index:30}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:15px} img{max-width:100%} [hidden]{display:none!important} *{box-sizing:border-box}
.acct{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}
.acct button{font:600 .78rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:4px 8px;cursor:pointer}
#login{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px))}
#login .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
#login form{display:flex;flex-direction:column;gap:10px}
#login input{font:500 1rem var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
#login .go{font:700 1rem var(--f-body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px;cursor:pointer}
#login .link{background:none;border:0;color:var(--accent);font:600 .88rem var(--f-body);cursor:pointer;padding:0;text-align:left}
#lmsg{font-size:.88rem;color:var(--bad);margin:0}
</style>
</head><body>
<div id="login" hidden><div class="card">
  <h1 style="font-size:1.4rem">Turni Specializzandi</h1>
  <div class="pickers"><button id="lmode-in" aria-pressed="true" type="button">Entra</button><button id="lmode-up" aria-pressed="false" type="button">Registrati</button></div>
  <form id="lform"><input id="lmail" type="email" autocomplete="email" placeholder="La tua email" required><input id="lpw" type="password" autocomplete="current-password" placeholder="Password (almeno 6 caratteri)" required minlength="6">
   <button class="go" id="lgo" type="submit">Entra</button><button class="link" id="lreset" type="button">Password dimenticata?</button></form>
  <div id="lverify" hidden class="stack" style="gap:10px"><p style="margin:0">Ti abbiamo mandato un'email a <strong id="lvmail"></strong>: apri il link per confermare l'indirizzo, poi torna qui. Controlla anche lo spam.</p>
   <button class="go" id="lvdone" type="button">Ho confermato</button><button class="link" id="lvagain" type="button">Invia di nuovo l'email</button><button class="link" id="lvout" type="button">Esci</button></div>
  <div id="ldenied" hidden class="stack" style="gap:10px"><p style="margin:0">L'email <strong id="ldmail"></strong> non è ancora autorizzata.</p>
   <p id="ldstate" style="margin:0;font-size:.9rem" class="muted">Invia la richiesta a chi gestisce i turni: quando la approva potrai entrare.</p>
   <button class="go" id="ldreq" type="button">Chiedi l'accesso</button><button class="link" id="ldretry" type="button">Ho ricevuto l'accesso: riprova</button><button class="link" id="ldout" type="button">Esci</button></div>
  <p id="lmsg" hidden></p>
</div></div>

<header class="top"><div class="in">
  <div class="brand"><h1>Turni Specializzandi</h1><span class="row" style="gap:10px"><span class="sync" id="sync">Caricamento…</span><span class="acct" id="acct" hidden><span id="whoami"></span><button id="logout" type="button">Esci</button></span></span></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="turni">Turni</button>
    <button role="tab" data-tab="modturni" hidden>Modifica turni</button>
    <button role="tab" data-tab="cambi">Cambi</button>
    <button role="tab" data-tab="indisp">Indisponibilità</button>
    <button role="tab" data-tab="mese">Rotazioni</button>
    <button role="tab" data-tab="imp">Impostazioni</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
